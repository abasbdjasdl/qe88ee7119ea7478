name: Build reusable network components
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/network/**', 'tests/network_*', 'tests/network_timer_fakes/**', 'tests/network_dma_fakes/**', 'tests/network_irq_fakes/**', 'tests/network_rfk_fakes/**', 'tools/build_network_stack.py', 'tools/check_network_reference.py', 'tools/import_radio_reference.py', 'tools/import_mac_reference.py', 'tools/import_rfk_reference.py', 'tools/import_channel_reference.py', 'tools/import_power_reference.py', 'tools/import_device_power_reference.py', 'tools/import_station_tables_reference.py', '.github/workflows/network-port.yml']
permissions:
  contents: read
jobs:
  network:
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch pinned upstream stack and kernel headers
        shell: bash
        run: |
          git init build-itlwm
          git -C build-itlwm remote add origin https://github.com/OpenIntelWireless/itlwm.git
          git -C build-itlwm fetch --depth 1 origin 53c51c2cdd6e4b69beb91f310d74c53422b0f8bd
          git -C build-itlwm checkout --detach FETCH_HEAD
          git init MacKernelSDK
          git -C MacKernelSDK remote add origin https://github.com/acidanthera/MacKernelSDK.git
          git -C MacKernelSDK fetch --depth 1 origin 05094e5e88cec7caedbfb35e8449ed0db94bf95b
          git -C MacKernelSDK checkout --detach FETCH_HEAD
          git init build-rtw89
          git -C build-rtw89 remote add origin https://github.com/lwfinger/rtw89.git
          git -C build-rtw89 fetch --depth 1 origin d1fced1b8a741dc9f92b47c69489c24385945f6e
          git -C build-rtw89 checkout --detach FETCH_HEAD
      - name: Test Realtek descriptors, PCI queues and firmware packets
        shell: bash
        run: |
          mkdir -p build/network-stack
          python3 tools/check_network_reference.py build-rtw89 | tee build/network-stack/wire-reference-tests.txt
          xcrun clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined tests/network_mailbox_test.cpp -o build/network_mailbox_test
          ./build/network_mailbox_test | tee build/network-stack/mailbox-tests.txt
          python3 tools/import_mac_reference.py build-rtw89
          git diff --exit-code -- src/network/Rtw8852bMacConstants.hpp src/network/Rtw8852bMacFunctions.inc src/network/mac-reference-provenance.json
          xcrun clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined tests/network_mac_init_test.cpp -o build/network_mac_init_test
          ./build/network_mac_init_test | tee build/network-stack/mac-init-tests.txt
          python3 tools/import_device_power_reference.py build-rtw89
          git diff --exit-code -- src/network/Rtw8852bDevicePowerConstants.hpp src/network/Rtw8852bDevicePowerFunctions.inc src/network/device-power-reference-provenance.json
          xcrun clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined tests/network_device_power_test.cpp -o build/network_device_power_test
          ./build/network_device_power_test | tee build/network-stack/device-power-tests.txt
          xcrun clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined -I tests/network_rfk_fakes tests/network_device_power_native_test.cpp -o build/network_device_power_native_test
          ./build/network_device_power_native_test | tee build/network-stack/device-power-native-tests.txt
          python3 tools/import_rfk_reference.py build-rtw89
          git diff --exit-code -- src/network/Rtw8852bRfkConstants.hpp src/network/Rtw8852bRfkFunctions.inc src/network/rfk-reference-provenance.json
          python3 tools/import_channel_reference.py build-rtw89
          git diff --exit-code -- src/network/Rtw8852bChannelConstants.hpp src/network/Rtw8852bChannelFunctions.inc src/network/channel-reference-provenance.json
          python3 tools/import_power_reference.py build-rtw89
          git diff --exit-code -- src/network/Rtw8852bPowerTables.hpp src/network/Rtw8852bPowerTables.cpp src/network/Rtw8852bPowerFunctions.inc src/network/power-reference-provenance.json
          xcrun clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined tests/network_power_test.cpp src/network/Rtw8852bPowerTables.cpp -o build/network_power_test
          ./build/network_power_test | tee build/network-stack/power-tests.txt
          xcrun clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined tests/network_channel_test.cpp src/network/Rtw8852bPowerTables.cpp -o build/network_channel_test
          ./build/network_channel_test | tee build/network-stack/channel-tests.txt
          xcrun clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined tests/network_rfk_test.cpp -o build/network_rfk_test
          ./build/network_rfk_test | tee build/network-stack/rfk-tests.txt
          xcrun clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined -I tests/network_rfk_fakes tests/network_rfk_native_test.cpp src/network/Rtw8852bRadioTables.cpp src/network/Rtw8852bPowerTables.cpp -o build/network_rfk_native_test
          ./build/network_rfk_native_test | tee build/network-stack/rfk-native-tests.txt
          xcrun clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined tests/network_runtime_test.cpp -o build/network_runtime_test
          ./build/network_runtime_test | tee build/network-stack/runtime-tests.txt
          xcrun clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined -I tests/network_rfk_fakes tests/network_runtime_native_test.cpp -o build/network_runtime_native_test
          ./build/network_runtime_native_test | tee build/network-stack/runtime-native-tests.txt
          xcrun clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined -I tests/network_irq_fakes tests/network_interrupts_test.cpp -o build/network_interrupts_test
          ./build/network_interrupts_test | tee build/network-stack/interrupt-tests.txt
          xcrun clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined tests/network_queue_service_test.cpp -o build/network_queue_service_test
          ./build/network_queue_service_test | tee build/network-stack/queue-service-tests.txt
          python3 tools/import_radio_reference.py build-rtw89
          git diff --exit-code -- src/network/Rtw8852bRadioTables.cpp src/network/Rtw8852bEfuseLayout.hpp src/network/radio-reference-provenance.json tests/network_radio_reference.inc
          xcrun clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined tests/network_radio_test.cpp src/network/Rtw8852bRadioTables.cpp -o build/network_radio_test
          ./build/network_radio_test | tee build/network-stack/radio-tests.txt
          xcrun clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined tests/network_efuse_reader_test.cpp -o build/network_efuse_reader_test
          ./build/network_efuse_reader_test | tee build/network-stack/efuse-reader-tests.txt
          xcrun clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined -I tests/network_rfk_fakes tests/network_dav_efuse_test.cpp -o build/network_dav_efuse_test
          ./build/network_dav_efuse_test | tee build/network-stack/dav-efuse-tests.txt
          xcrun clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined tests/network_device_calibration_test.cpp -o build/network_device_calibration_test
          ./build/network_device_calibration_test | tee build/network-stack/device-calibration-tests.txt
          xcrun clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined tests/network_bt_rfk_test.cpp -o build/network_bt_rfk_test
          ./build/network_bt_rfk_test | tee build/network-stack/bt-rfk-tests.txt
          xcrun clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined tests/network_firmware_commands_test.cpp -o build/network_firmware_commands_test
          ./build/network_firmware_commands_test | tee build/network-stack/firmware-commands-tests.txt
          xcrun clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined -I tests/network_rfk_fakes tests/network_bt_native_test.cpp -o build/network_bt_native_test
          ./build/network_bt_native_test | tee build/network-stack/bt-native-tests.txt
          xcrun clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined tests/network_station_controller_test.cpp -o build/network_station_controller_test
          ./build/network_station_controller_test | tee build/network-stack/station-controller-tests.txt
          python3 tools/import_station_tables_reference.py build-rtw89
          git diff --exit-code -- src/network/Rtw8852bStationTableFields.hpp src/network/station-tables-reference-provenance.json
          xcrun clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined tests/network_station_tables_test.cpp -o build/network_station_tables_test
          ./build/network_station_tables_test | tee build/network-stack/station-tables-tests.txt
          xcrun clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined tests/network_bt_initialization_test.cpp -o build/network_bt_initialization_test
          ./build/network_bt_initialization_test | tee build/network-stack/bt-initialization-tests.txt
          xcrun clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined -DBT_INITIALIZATION_NATIVE_TEST -I tests/network_rfk_fakes tests/network_bt_initialization_test.cpp src/network/Rtw8852bRadioTables.cpp -o build/network_bt_initialization_native_test
          ./build/network_bt_initialization_native_test | tee build/network-stack/bt-initialization-native-tests.txt
          xcrun clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined -I tests/network_dma_fakes tests/network_dma_test.cpp -o build/network_dma_test
          ./build/network_dma_test | tee build/network-stack/dma-tests.txt
          xcrun clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined tests/network_rx_dma_test.cpp -o build/network_rx_dma_test
          ./build/network_rx_dma_test | tee build/network-stack/rx-dma-tests.txt
          xcrun clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined -I tests/network_dma_fakes tests/network_tx_dma_test.cpp -o build/network_tx_dma_test
          ./build/network_tx_dma_test | tee build/network-stack/tx-dma-tests.txt
          xcrun clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined tests/network_descriptors_test.cpp -o build/network_descriptors_test
          ./build/network_descriptors_test | tee build/network-stack/descriptor-tests.txt
          xcrun clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined tests/network_pci_test.cpp -o build/network_pci_test
          ./build/network_pci_test | tee build/network-stack/pci-tests.txt
          xcrun clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined -I tests/network_timer_fakes tests/network_timers_test.cpp -o build/network_timers_test
          ./build/network_timers_test | tee build/network-stack/timer-tests.txt
          xcrun clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined tests/network_ring_setup_test.cpp -o build/network_ring_setup_test
          ./build/network_ring_setup_test | tee build/network-stack/ring-setup-tests.txt
      - name: Compile existing macOS 802.11 and WPA stack
        shell: bash
        env:
          MAC_KERNEL_SDK: ${{ github.workspace }}/MacKernelSDK
        run: |
          set -o pipefail
          python3 tools/build_network_stack.py build-itlwm 2>&1 | tee build/network-stack/build.log
          tar -czf build/network-stack/itlwm-stack-source.tar.gz -C build-itlwm itl80211 include itlwm/PrivateSPI.pch LICENSE
          tar -czf build/network-stack/port-source.tar.gz src/network tools/build_network_stack.py tools/check_network_reference.py tools/import_network_reference.py tools/import_radio_reference.py tools/import_mac_reference.py tools/import_rfk_reference.py tools/import_channel_reference.py tools/import_power_reference.py tools/import_device_power_reference.py tools/import_station_tables_reference.py tests/network_* LICENSE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: network-components-${{ github.sha }}
          path: |
            build/network-stack/*.a
            build/network-stack/*.json
            build/network-stack/*.txt
            build/network-stack/*.log
            build/network-stack/*LICENSE
            build/network-stack/*.tar.gz
          retention-days: 7
