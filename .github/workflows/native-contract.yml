name: Audit native wireless interface layout
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/build_native_contract.py', 'tools/build_native_sequoia.py', 'tools/native_abi/**', '.github/workflows/native-contract.yml', 'src/network/Wireless*.hpp', 'src/network/NativeWireless*.hpp', 'src/network/NativeWcl*.hpp', 'src/network/NativeScan*.hpp', 'src/network/NativeForegroundScan.hpp', 'src/network/MacNetworkController.*', 'tests/network_wireless_*', 'tests/network_native_*']
permissions:
  contents: read
jobs:
  contract:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch pinned headers
        run: |
          git init build-itlwm
          git -C build-itlwm remote add origin https://github.com/OpenIntelWireless/itlwm.git
          git -C build-itlwm fetch --depth 1 origin 53c51c2cdd6e4b69beb91f310d74c53422b0f8bd
          git -C build-itlwm checkout --detach FETCH_HEAD
          git init MacKernelSDK
          git -C MacKernelSDK remote add origin https://github.com/acidanthera/MacKernelSDK.git
          git -C MacKernelSDK fetch --depth 1 origin 05094e5e88cec7caedbfb35e8449ed0db94bf95b
          git -C MacKernelSDK checkout --detach FETCH_HEAD
      - name: Audit native declarations, scan sequencing, and packet ownership
        run: |
          set -o pipefail
          mkdir -p build/native-contract
          xcrun clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined tests/network_native_wcl_candidates_test.cpp -o build/native-contract/wcl-candidates-test
          build/native-contract/wcl-candidates-test | tee build/native-contract/wcl-candidates-test-result.txt
          xcrun clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined tests/network_native_wcl_join_test.cpp -o build/native-contract/wcl-join-test
          build/native-contract/wcl-join-test | tee build/native-contract/wcl-join-test-result.txt
          xcrun clang++ -std=c++17 -O2 -DNDEBUG -Wall -Wextra -Werror -fsanitize=address,undefined tests/network_native_wcl_scan_test.cpp -o build/native-contract/wcl-scan-test
          build/native-contract/wcl-scan-test | tee build/native-contract/wcl-scan-test-result.txt
          xcrun clang++ -std=c++17 -O2 -DNDEBUG -Wall -Wextra -Werror -fsanitize=address,undefined tests/network_native_wcl_scan_plan_test.cpp -o build/native-contract/wcl-scan-plan-test
          build/native-contract/wcl-scan-plan-test | tee build/native-contract/wcl-scan-plan-test-result.txt
          xcrun clang++ -std=c++17 -O2 -DNDEBUG -Wall -Wextra -Werror -fsanitize=address,undefined tests/network_native_wcl_scan_results_test.cpp -o build/native-contract/wcl-scan-results-test
          build/native-contract/wcl-scan-results-test | tee build/native-contract/wcl-scan-results-test-result.txt
          xcrun clang++ -target x86_64-apple-macos15.0 -std=c++17 -O2 -ffreestanding -fno-exceptions -fno-rtti -fno-stack-protector -Wframe-larger-than=512 -Werror -c tests/network_native_wcl_scan_results_kernel_compile.cpp -o build/native-contract/wcl-scan-results-kernel.o
          xcrun clang++ -std=c++17 -O2 -DNDEBUG -Wall -Wextra -Werror -fsanitize=address,undefined tests/network_native_wcl_results_observer_test.cpp -o build/native-contract/wcl-results-observer-test
          build/native-contract/wcl-results-observer-test | tee build/native-contract/wcl-results-observer-test-result.txt
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined tests/network_native_scan_cache_test.cpp -o build/native-contract/scan-cache-test
          build/native-contract/scan-cache-test | tee build/native-contract/scan-cache-test-result.txt
          xcrun clang++ -std=c++17 -O2 -DNDEBUG -Wall -Wextra -Werror -fsanitize=address,undefined tests/network_native_scan_observation_test.cpp -o build/native-contract/scan-observation-test
          build/native-contract/scan-observation-test | tee build/native-contract/scan-observation-test-result.txt
          xcrun clang++ -std=c++17 -O2 -DNDEBUG -Wall -Wextra -Werror -fsanitize=address,undefined tests/network_native_foreground_scan_test.cpp -o build/native-contract/foreground-scan-test
          build/native-contract/foreground-scan-test | tee build/native-contract/foreground-scan-test-result.txt
          xcrun clang++ -std=c++17 -O2 -DNDEBUG -Wall -Wextra -Werror -fsanitize=address,undefined tests/network_native_scan_probe_test.cpp -o build/native-contract/scan-probe-test
          build/native-contract/scan-probe-test | tee build/native-contract/scan-probe-test-result.txt
          xcrun clang++ -std=c++17 -O2 -DNDEBUG -Wall -Wextra -Werror -fsanitize=address,undefined tests/network_native_scan_probe_tx_test.cpp -o build/native-contract/scan-probe-tx-test
          build/native-contract/scan-probe-tx-test | tee build/native-contract/scan-probe-tx-test-result.txt
          xcrun clang++ -std=c++17 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer tests/network_native_wcl_beacon_test.cpp -o build/native-contract/wcl-beacon-test
          build/native-contract/wcl-beacon-test | tee build/native-contract/wcl-beacon-test-result.txt
          xcrun clang++ -std=c++14 -O2 -Wall -Wextra -Werror -fsanitize=address,undefined -DR16_NATIVE_ABI_AUDIT_ONLY=1 tools/native_abi/native_infra_scan_bridge_test.cpp -o build/native-contract/infra-scan-bridge-test
          build/native-contract/infra-scan-bridge-test | tee build/native-contract/infra-scan-bridge-test-result.txt
          xcrun clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined tests/network_wireless_selection_test.cpp -o build/native-contract/selection-test
          build/native-contract/selection-test
          xcrun clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined tests/network_wireless_rsn_test.cpp -o build/native-contract/rsn-test
          build/native-contract/rsn-test
          python3 tools/build_native_contract.py build-itlwm MacKernelSDK
          python3 tools/build_native_sequoia.py build-itlwm MacKernelSDK --out build/native-contract/sequoia
          python3 tests/network_native_sequoia_audit_test.py build/native-contract/sequoia
          python3 tools/native_abi/audit_startup_prototype.py build-itlwm MacKernelSDK build/native-contract/sequoia --out build/native-contract/startup
          python3 tools/native_abi/audit_infra_frontend.py build-itlwm MacKernelSDK build/native-contract/sequoia --out build/native-contract/infra
          python3 tools/native_abi/native_cpu_packet_bridge_test.py --out build/native-contract/cpu-packet-bridge
          python3 tools/native_abi/audit_native_packet_port.py --out build/native-contract/packet-port
          python3 tools/native_abi/audit_native_wcl_event_sender.py --out build/native-contract/wcl-event-sender
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-contract-${{ github.sha }}
          path: build/native-contract
