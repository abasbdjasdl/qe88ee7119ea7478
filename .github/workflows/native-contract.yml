name: Audit native wireless interface layout
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/build_native_contract.py', 'tools/build_native_sequoia.py', 'tools/native_abi/**', '.github/workflows/native-contract.yml', 'src/network/Wireless*.hpp', 'src/network/NativeWireless*.hpp', 'src/network/NativeWcl*.hpp', 'src/network/NativeScan*.hpp', 'src/network/MacNetworkController.*', 'tests/network_wireless_*', 'tests/network_native_*']
permissions:
  contents: read
jobs:
  contract:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch pinned headers
        run: |
          git init build-itlwm
          git -C build-itlwm remote add origin https://github.com/OpenIntelWireless/itlwm.git
          git -C build-itlwm fetch --depth 1 origin 53c51c2cdd6e4b69beb91f310d74c53422b0f8bd
          git -C build-itlwm checkout --detach FETCH_HEAD
          git init MacKernelSDK
          git -C MacKernelSDK remote add origin https://github.com/acidanthera/MacKernelSDK.git
          git -C MacKernelSDK fetch --depth 1 origin 05094e5e88cec7caedbfb35e8449ed0db94bf95b
          git -C MacKernelSDK checkout --detach FETCH_HEAD
      - name: Check selection queue and private declarations
        run: |
          set -o pipefail
          mkdir -p build/native-contract
          xcrun clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined tests/network_native_wcl_candidates_test.cpp -o build/native-contract/wcl-candidates-test
          build/native-contract/wcl-candidates-test | tee build/native-contract/wcl-candidates-test-result.txt
          xcrun clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined tests/network_native_wcl_join_test.cpp -o build/native-contract/wcl-join-test
          build/native-contract/wcl-join-test | tee build/native-contract/wcl-join-test-result.txt
          xcrun clang++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined tests/network_native_scan_cache_test.cpp -o build/native-contract/scan-cache-test
          build/native-contract/scan-cache-test | tee build/native-contract/scan-cache-test-result.txt
          xcrun clang++ -std=c++17 -O2 -DNDEBUG -Wall -Wextra -Werror -fsanitize=address,undefined tests/network_native_scan_observation_test.cpp -o build/native-contract/scan-observation-test
          build/native-contract/scan-observation-test | tee build/native-contract/scan-observation-test-result.txt
          xcrun clang++ -std=c++17 -O1 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer tests/network_native_wcl_beacon_test.cpp -o build/native-contract/wcl-beacon-test
          build/native-contract/wcl-beacon-test | tee build/native-contract/wcl-beacon-test-result.txt
          xcrun clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined tests/network_wireless_selection_test.cpp -o build/native-contract/selection-test
          build/native-contract/selection-test
          xcrun clang++ -std=c++14 -Wall -Wextra -Werror -fsanitize=address,undefined tests/network_wireless_rsn_test.cpp -o build/native-contract/rsn-test
          build/native-contract/rsn-test
          python3 tools/build_native_contract.py build-itlwm MacKernelSDK
          python3 tools/build_native_sequoia.py build-itlwm MacKernelSDK --out build/native-contract/sequoia
          python3 tests/network_native_sequoia_audit_test.py build/native-contract/sequoia
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-contract-${{ github.sha }}
          path: build/native-contract
