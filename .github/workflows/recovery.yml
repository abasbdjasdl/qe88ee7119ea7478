name: Build recovery diagnostic overlay
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Retrieve temporary draft build input
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/recovery
          gh release download recovery-build-input-20260921 --repo "$GITHUB_REPOSITORY" --pattern BaseSystem.dmg --dir build/recovery
      - name: Build and validate recovery patch
        shell: bash
        run: |
          set -o pipefail
          bash recovery-autolog/build.sh 2>&1 | tee recovery-build.log
      - name: Test launchd collection and automatic FAT mount
        shell: bash
        run: bash recovery-autolog/test-collector.sh
      - name: Upload only changed chunks and verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovery-autolog-patch
          retention-days: 7
          if-no-files-found: error
          path: |
            build/recovery/recovery-autolog.patch.zip
            build/recovery/PATCH-SHA256SUMS.txt
            build/recovery/Diagnostic.dmg.verification.json
            build/recovery/source-commit.txt
            build/recovery/verification.txt
            build/recovery/collector-integration-test.txt
            recovery-build.log
